# Гость для замера в Firecracker (scripts/fc-bench.sh): сеть на tap0 хоста, ключ подставляется.
[system]
hostname = "rim-bench"
packages = ["busybox", "dropbear"]
ssh_authorized_keys = ["ssh-ed25519 TEST-KEY-PLACEHOLDER"]

[service.sshd]
exec = ["/bin/dropbear", "-F", "-s", "-g", "-p", "22", "-P", "/run/dropbear.pid", "-r", "/data/ssh/host_ed25519"]

[target.fc-x86]
boot = "direct"
arch = "x86_64"
kernel = "linux"
disk = { root = "64M", data = "64M" }
net = { address = "172.16.0.2/30", gateway = "172.16.0.1", dns = "1.1.1.1" }
