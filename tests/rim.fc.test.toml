[system]
hostname = "rim-fc-test"
packages = ["busybox", "dropbear"]
# Заглушка: настоящий ключ подставляет scripts/lib-testkey.sh, новый на каждый прогон.
ssh_authorized_keys = ["ssh-ed25519 TEST-KEY-PLACEHOLDER"]

# Без udhcpc: сеть поднимает ядро по ip= (как в Firecracker, где DHCP нет).

[service.sshd]
exec = ["/bin/dropbear", "-F", "-s", "-g", "-p", "22", "-P", "/run/dropbear.pid", "-r", "/data/ssh/host_ed25519"]

# Адреса — слой user-сети QEMU (slirp) для локального теста; для Firecracker см. docs/firecracker.md.
[target.fc]
boot = "direct"
kernel = "linux"
disk = { root = "64M", data = "64M" }
net = { address = "10.0.2.15/24", gateway = "10.0.2.2", dns = "10.0.2.3" }

[target.fc-x86]
boot = "direct"
arch = "x86_64"
kernel = "linux"
disk = { root = "64M", data = "64M" }
net = { address = "10.0.2.15/24", gateway = "10.0.2.2", dns = "10.0.2.3" }
